<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T9 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #07111f;
      --panel: rgba(8, 17, 31, 0.76);
      --panel-border: rgba(148, 163, 184, 0.18);
      --text: #e6eefc;
      --muted: #93a4bf;
      --primary: #4fd1c5;
      --button-text: #04111f;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #eef6ff;
        --panel: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(15, 23, 42, 0.08);
        --text: #11213a;
        --muted: #586a84;
        --primary: #0f766e;
        --button-text: #f8fafc;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(79, 209, 197, 0.2), transparent 24%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.22), transparent 28%),
        linear-gradient(145deg, var(--bg), #123154);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .dashboard-card {
      width: min(100%, 720px);
      padding: 32px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }

    .user-block {
      margin: 24px 0;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .user-block strong,
    .user-block span { display: block; }

    .user-block strong { margin-bottom: 6px; font-size: 0.96rem; color: var(--muted); }
    .user-block span { font-size: 1.05rem; font-weight: 700; }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button,
    a {
      border: 0;
      border-radius: 16px;
      padding: 14px 18px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: var(--button-text);
    }

    .secondary {
      background: rgba(148, 163, 184, 0.14);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }
  </style>
</head>
<body>
  <main class="dashboard-card">
    <h1>Dashboard</h1>
    <p>click on the go to t9os!! button to go to the t9os</p>
    <div class="user-block">
      <strong>Signed in as</strong>
      <span id="userEmail">Loading session...</span>
    </div>
    <div class="actions">
      <a class="secondary" href="/auth.html">go to t9os!!</a>
      <button class="primary" id="signOutButton" type="button">Sign Out</button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "https://xjludpzfbzljystpadde.supabase.co";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_POcO9f9w1eQgbnKeMABmxQ_lQb-jVGU";
    const AUTH_URL = new URL("../auth.html", window.location.href).href;

    const isConfigured =
      !SUPABASE_URL.includes("YOUR_PROJECT_ID") &&
      !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY");

    const userEmail = document.getElementById("userEmail");
    const signOutButton = document.getElementById("signOutButton");

    if (!isConfigured) {
      userEmail.textContent = "Configure Supabase URL and anon key first.";
      signOutButton.disabled = true;
    } else {
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      });

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === "SIGNED_OUT" || !session) {
          window.location.assign(AUTH_URL);
        }
      });

      supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error || !data.session) {
          window.location.assign(AUTH_URL);
          return;
        }
        userEmail.textContent = data.session.user.email || "Signed-in user";
      });

      signOutButton.addEventListener("click", async () => {
        signOutButton.disabled = true;
        signOutButton.textContent = "Signing out...";
        await supabaseClient.auth.signOut();
      });
    }
  </script>
</body>
</html>
