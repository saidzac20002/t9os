<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T9 Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06111d;
      --bg2: #102542;
      --panel: rgba(7, 17, 31, 0.82);
      --panel-border: rgba(148, 163, 184, 0.16);
      --text: #e5eefb;
      --muted: #91a4c3;
      --primary: #4fd1c5;
      --danger: #f87171;
      --success: #86efac;
      --input: rgba(15, 23, 42, 0.75);
      --input-border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(79, 209, 197, 0.16), transparent 28%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.2), transparent 26%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      padding: 24px;
    }

    .shell {
      width: min(1200px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .hero {
      padding: 28px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); letter-spacing: -0.04em; }
    .hero p, .muted { color: var(--muted); }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button,
    button,
    input {
      font: inherit;
    }

    .button,
    button {
      border: 0;
      cursor: pointer;
      border-radius: 16px;
      padding: 14px 18px;
      font-weight: 800;
    }

    .button-primary {
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: #04111f;
    }

    .button-secondary {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .button-danger {
      background: rgba(248, 113, 113, 0.14);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .create-panel,
    .users-panel {
      padding: 24px;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 0.94rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: 16px;
      background: var(--input);
      color: var(--text);
      padding: 14px 15px;
      outline: none;
    }

    input:focus {
      border-color: rgba(79, 209, 197, 0.55);
      box-shadow: 0 0 0 4px rgba(79, 209, 197, 0.12);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      padding: 0;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.45;
    }

    .status.show { display: block; }
    .status.error {
      color: var(--danger);
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }
    .status.success {
      color: var(--success);
      background: rgba(20, 83, 45, 0.35);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .users-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .users-list {
      display: grid;
      gap: 14px;
    }

    .user-card {
      border: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(148, 163, 184, 0.06);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .user-meta {
      display: grid;
      gap: 4px;
    }

    .user-email {
      font-size: 1rem;
      font-weight: 700;
    }

    .tag-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .tag {
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .empty {
      padding: 30px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.18);
      border-radius: 18px;
    }

    @media (max-width: 960px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel hero">
      <div>
        <p class="muted">T9 OS</p>
        <h1>Admin Panel</h1>
        <p class="muted">Create and delete Supabase Auth accounts from one place.</p>
      </div>
      <div class="actions">
        <!--<a class="button button-secondary" href="./t9os.html">Back to app</a> -->
        <button class="button button-secondary" id="refreshButton" type="button">Refresh users</button>
        <button class="button button-danger" id="signOutButton" type="button">Sign out</button>
      </div>
    </section>

    <section class="grid">
      <section class="panel create-panel">
        <p class="muted">Admin action</p>
        <h2>Create account</h2>
        <form id="createUserForm">
          <label>
            Full Name
            <input id="fullName" type="text" placeholder="Alex Morgan" />
          </label>
          <label>
            Email
            <input id="email" type="email" placeholder="user@example.com" required />
          </label>
          <label>
            Password
            <input id="password" type="password" placeholder="Minimum 8 characters" required />
          </label>
          <label class="checkbox">
            <input id="emailConfirm" type="checkbox" />
            Mark email as confirmed immediately
          </label>
          <button class="button button-primary" id="createButton" type="submit">Create account</button>
        </form>
        <div class="status" id="createStatus" role="alert" aria-live="polite"></div>
      </section>

      <section class="panel users-panel">
        <div class="users-head">
          <div>
            <p class="muted">Account inventory</p>
            <h2>Users</h2>
          </div>
          <p class="muted" id="sessionEmail">Checking admin session...</p>
        </div>
        <div class="status" id="usersStatus" role="alert" aria-live="polite"></div>
        <div class="users-list" id="usersList">
          <div class="empty">Loading users...</div>
        </div>
      </section>
    </section>
  </main>

  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "https://xjludpzfbzljystpadde.supabase.co";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_POcO9f9w1eQgbnKeMABmxQ_lQb-jVGU";
    const AUTH_URL = new URL("./auth.html", window.location.href).href;
    const API_CANDIDATES = [
      new URL("/.netlify/functions/admin-users", window.location.origin).href,
      new URL("./api/admin-users", window.location.href).href
    ];

    const createUserForm = document.getElementById("createUserForm");
    const createButton = document.getElementById("createButton");
    const refreshButton = document.getElementById("refreshButton");
    const signOutButton = document.getElementById("signOutButton");
    const usersList = document.getElementById("usersList");
    const usersStatus = document.getElementById("usersStatus");
    const createStatus = document.getElementById("createStatus");
    const sessionEmail = document.getElementById("sessionEmail");

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    });

    let activeSession = null;

    function setStatus(element, type, message) {
      element.className = "status show " + type;
      element.textContent = message;
    }

    function clearStatus(element) {
      element.className = "status";
      element.textContent = "";
    }

    async function getAccessToken() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error || !data.session) {
        window.location.assign(AUTH_URL);
        throw new Error("Missing session.");
      }

      activeSession = data.session;
      sessionEmail.textContent = data.session.user.email || "Signed-in admin";
      return data.session.access_token;
    }

    async function apiRequest(method, body, query) {
      const token = await getAccessToken();
      let lastError = new Error("Request failed.");

      for (const candidate of API_CANDIDATES) {
        const url = new URL(candidate);

        if (query) {
          Object.entries(query).forEach(([key, value]) => url.searchParams.set(key, value));
        }

        try {
          const response = await fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`
            },
            body: body ? JSON.stringify(body) : undefined
          });

          const data = await response.json().catch(() => null);

          if (response.ok) {
            return data;
          }

          if (response.status === 404) {
            lastError = new Error("Admin endpoint was not found on this host.");
            continue;
          }

          throw new Error(data?.error || "Request failed.");
        } catch (error) {
          lastError = error;
        }
      }

      throw lastError;
    }

    function formatDate(value) {
      if (!value) return "Unknown";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "Unknown" : date.toLocaleString();
    }

    function renderUsers(users) {
      if (!users.length) {
        usersList.innerHTML = '<div class="empty">No users found.</div>';
        return;
      }

      usersList.innerHTML = users.map((user) => {
        const fullName = user.user_metadata?.full_name || "No full name";
        const confirmed = user.email_confirmed_at ? "Confirmed" : "Unconfirmed";
        return `
          <article class="user-card">
            <div class="user-meta">
              <div class="user-email">${user.email || "No email"}</div>
              <div class="muted">${fullName}</div>
              <div class="tag-row">
                <span class="tag">${confirmed}</span>
                <span class="tag">Created ${formatDate(user.created_at)}</span>
                <span class="tag">${user.id}</span>
              </div>
            </div>
            <button class="button button-danger" type="button" data-delete-user="${user.id}" data-email="${user.email || ""}">
              Delete user
            </button>
          </article>
        `;
      }).join("");
    }

    async function loadUsers() {
      clearStatus(usersStatus);
      usersList.innerHTML = '<div class="empty">Loading users...</div>';

      try {
        const data = await apiRequest("GET");
        renderUsers(data.users || []);
      } catch (error) {
        usersList.innerHTML = '<div class="empty">Unable to load users.</div>';
        setStatus(usersStatus, "error", error.message);
      }
    }

    createUserForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearStatus(createStatus);

      const payload = {
        fullName: document.getElementById("fullName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        emailConfirm: document.getElementById("emailConfirm").checked
      };

      if (!payload.email || !payload.password) {
        setStatus(createStatus, "error", "Email and password are required.");
        return;
      }

      if (payload.password.length < 8) {
        setStatus(createStatus, "error", "Password must be at least 8 characters.");
        return;
      }

      createButton.disabled = true;
      createButton.textContent = "Creating...";

      try {
        await apiRequest("POST", payload);
        setStatus(createStatus, "success", "Account created successfully.");
        createUserForm.reset();
        await loadUsers();
      } catch (error) {
        setStatus(createStatus, "error", error.message);
      } finally {
        createButton.disabled = false;
        createButton.textContent = "Create account";
      }
    });

    usersList.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-delete-user]");
      if (!button) return;

      const userId = button.getAttribute("data-delete-user");
      const email = button.getAttribute("data-email");
      const confirmed = window.confirm(`Delete ${email || "this user"}? This cannot be undone.`);

      if (!confirmed) return;

      button.disabled = true;
      button.textContent = "Deleting...";

      try {
        await apiRequest("DELETE", null, { id: userId });
        setStatus(usersStatus, "success", "User deleted successfully.");
        await loadUsers();
      } catch (error) {
        button.disabled = false;
        button.textContent = "Delete user";
        setStatus(usersStatus, "error", error.message);
      }
    });

    refreshButton.addEventListener("click", loadUsers);

    signOutButton.addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.assign(AUTH_URL);
    });

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        window.location.assign(AUTH_URL);
      }
    });

    getAccessToken().then(loadUsers).catch(() => {});
  </script>
</body>
</html>
