<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T9 Auth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #08111f;
      --bg-accent: #10233d;
      --card: rgba(9, 18, 33, 0.78);
      --card-border: rgba(148, 163, 184, 0.18);
      --text: #e5eefb;
      --muted: #95a5c2;
      --input: rgba(15, 23, 42, 0.78);
      --input-border: rgba(148, 163, 184, 0.2);
      --primary: #4fd1c5;
      --primary-text: #04111f;
      --danger: #fca5a5;
      --danger-bg: rgba(127, 29, 29, 0.35);
      --success: #86efac;
      --success-bg: rgba(20, 83, 45, 0.35);
      --shadow: 0 32px 90px rgba(0, 0, 0, 0.28);
      --radius: 28px;
      --field-radius: 18px;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f3f8ff;
        --bg-accent: #d9ecff;
        --card: rgba(255, 255, 255, 0.76);
        --card-border: rgba(15, 23, 42, 0.08);
        --text: #10213a;
        --muted: #5b6b84;
        --input: rgba(248, 250, 252, 0.92);
        --input-border: rgba(15, 23, 42, 0.1);
        --primary: #0f766e;
        --primary-text: #f8fafc;
        --danger: #b91c1c;
        --danger-bg: rgba(254, 226, 226, 0.92);
        --success: #166534;
        --success-bg: rgba(220, 252, 231, 0.95);
        --shadow: 0 32px 90px rgba(15, 23, 42, 0.14);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79, 209, 197, 0.2), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(96, 165, 250, 0.18), transparent 24%),
        radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.2), transparent 26%),
        linear-gradient(145deg, var(--bg), var(--bg-accent));
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 340px;
      height: 340px;
      border-radius: 999px;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
    }

    body::before { top: -80px; right: -60px; background: #38bdf8; }
    body::after { bottom: -120px; left: -70px; background: #2dd4bf; }

    .auth-shell {
      width: min(100%, 1120px);
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.02fr 0.98fr;
      gap: 22px;
      align-items: stretch;
    }

    .panel,
    .card {
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      background: var(--card);
      border-radius: var(--radius);
      animation: fadeUp 500ms ease both;
    }

    .panel {
      padding: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 680px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(79, 209, 197, 0.12);
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: #04111f;
      font-weight: 800;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .brand-copy h1 { font-size: 1.08rem; margin: 0; font-weight: 800; }
    .brand-copy p { margin: 2px 0 0; color: var(--muted); font-size: 0.94rem; }

    .panel h2 {
      font-size: clamp(2.2rem, 5vw, 4.2rem);
      line-height: 0.98;
      margin: 22px 0 14px;
      letter-spacing: -0.04em;
    }

    .panel p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      max-width: 34rem;
    }

    .feature-list { display: grid; gap: 14px; margin-top: 30px; }

    .feature-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .feature-item strong { display: block; margin-bottom: 4px; font-size: 0.98rem; }
    .feature-item span { color: var(--muted); font-size: 0.92rem; }

    .feature-icon {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: rgba(79, 209, 197, 0.14);
      color: var(--primary);
      font-size: 1rem;
      font-weight: 700;
    }

    .card {
      padding: 32px;
      min-height: 680px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card-header { margin-bottom: 26px; }
    .card-header h3 { margin: 0; font-size: 1.95rem; letter-spacing: -0.03em; }
    .card-header p { margin: 8px 0 0; color: var(--muted); font-size: 0.98rem; }

    .status-message {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .status-message.show { display: block; }
    .status-message.error { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(248, 113, 113, 0.28); }
    .status-message.success { background: var(--success-bg); color: var(--success); border: 1px solid rgba(74, 222, 128, 0.24); }

    form { display: grid; gap: 18px; }
    .field-group { display: grid; gap: 8px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { font-size: 0.94rem; font-weight: 600; }
    .input-wrap { position: relative; }

    input {
      width: 100%;
      border: 1px solid var(--input-border);
      border-radius: var(--field-radius);
      background: var(--input);
      color: var(--text);
      padding: 15px 16px;
      font: inherit;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
    }

    input::placeholder { color: color-mix(in srgb, var(--muted) 85%, transparent); }

    input:focus {
      border-color: color-mix(in srgb, var(--primary) 55%, white 12%);
      box-shadow: 0 0 0 4px rgba(45, 212, 191, 0.12);
      transform: translateY(-1px);
    }

    input.invalid { border-color: rgba(248, 113, 113, 0.7); }
    .password-input { padding-right: 52px; }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .toggle-password:hover,
    .toggle-password:focus-visible {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      outline: none;
    }

    .toggle-password svg { width: 18px; height: 18px; }
    .field-help { min-height: 1.1rem; font-size: 0.84rem; color: var(--muted); }
    .field-help.error { color: var(--danger); }
    .field-help.success { color: var(--success); }

    .submit-button {
      margin-top: 4px;
      border: 0;
      border-radius: 18px;
      padding: 15px 18px;
      font: inherit;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #60a5fa);
      color: var(--primary-text);
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
      box-shadow: 0 18px 30px rgba(45, 212, 191, 0.18);
    }

    .submit-button:hover:not(:disabled),
    .submit-button:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 24px 40px rgba(45, 212, 191, 0.24);
      outline: none;
    }

    .submit-button:disabled { cursor: wait; opacity: 0.72; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-right: 8px;
      border-radius: 999px;
      border: 2px solid rgba(4, 17, 31, 0.28);
      border-top-color: rgba(4, 17, 31, 0.92);
      vertical-align: text-bottom;
      animation: spin 800ms linear infinite;
    }

    .switch-copy { margin-top: 20px; text-align: center; color: var(--muted); font-size: 0.95rem; }
    .switch-copy button { border: 0; background: none; padding: 0; color: var(--primary); font: inherit; font-weight: 700; cursor: pointer; }
    .config-note { margin-top: 18px; color: var(--muted); font-size: 0.84rem; line-height: 1.5; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .auth-shell { grid-template-columns: 1fr; }
      .panel, .card { min-height: auto; }
    }

    @media (max-width: 560px) {
      body { padding: 16px; }
      .panel, .card { padding: 24px 20px; border-radius: 24px; }
      .field-row { grid-template-columns: 1fr; }
      .card-header h3 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <section class="panel" aria-label="Product overview">
      <div>
        <div class="brand">
          <div class="logo-mark" aria-hidden="true">T9</div>
          <div class="brand-copy">
            <h1>T9 OS</h1>
            <p>                                         </p>
          </div>
        </div>
        <span class="eyebrow">             </span>
        <p>
          No more codes, just premade passwords and if you had a password before, you can use that one.
        </p>
      </div>
    </section>

    <section class="card" aria-labelledby="auth-title">
      <div class="card-header">
        <h3 id="auth-title">Welcome back</h3>
        <p id="auth-subtitle">Sign in with your email and password to continue.</p>
      </div>
      <div class="status-message" id="statusMessage" role="alert" aria-live="polite"></div>
      <form id="authForm" novalidate>
        <div class="field-group">
          <label for="email">Email address</label>
          <div class="input-wrap">
            <input id="email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required />
          </div>
          <div class="field-help" id="emailHelp"></div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" class="password-input" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              <button class="toggle-password" type="button" data-toggle-password="password" aria-label="Show password">
                <span class="sr-only">Toggle password visibility</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
            <div class="field-help" id="passwordHelp"></div>
          </div>
        </div>
        <button class="submit-button" id="submitButton" type="submit">Sign In</button>
      </form>
      <p class="config-note">
        Use an existing account to sign in. Account creation has been removed from this page.
      </p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = window.SUPABASE_URL || "https://xjludpzfbzljystpadde.supabase.co";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "sb_publishable_POcO9f9w1eQgbnKeMABmxQ_lQb-jVGU";
    const DASHBOARD_URL = new URL("./t9os.html", window.location.href).href;

    const isConfigured =
      !SUPABASE_URL.includes("YOUR_PROJECT_ID") &&
      !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY");

    const authForm = document.getElementById("authForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const submitButton = document.getElementById("submitButton");
    const statusMessage = document.getElementById("statusMessage");

    const helpers = {
      email: document.getElementById("emailHelp"),
      password: document.getElementById("passwordHelp")
    };

    let isSubmitting = false;

    const supabaseClient = isConfigured
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        })
      : null;

    function redirectToDashboard() { window.location.assign(DASHBOARD_URL); }

    function setStatus(type, message) {
      statusMessage.className = "status-message show " + type;
      statusMessage.textContent = message;
    }

    function clearStatus() {
      statusMessage.className = "status-message";
      statusMessage.textContent = "";
    }

    function setHelp(input, message, state) {
      input.classList.remove("invalid");
      const helper = helpers[input.name];
      helper.textContent = message || "";
      helper.className = "field-help" + (state ? " " + state : "");
      if (state === "error") {
        input.classList.add("invalid");
      }
    }

    function validateEmail() {
      const email = emailInput.value.trim();
      if (!email) {
        setHelp(emailInput, "Email is required.", "error");
        return false;
      }
      const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      if (!valid) {
        setHelp(emailInput, "Enter a valid email address.", "error");
        return false;
      }
      setHelp(emailInput, "Looks good.", "success");
      return true;
    }

    function validatePassword() {
      const password = passwordInput.value;
      if (!password) {
        setHelp(passwordInput, "Password is required.", "error");
        return false;
      }
      if (password.length < 8) {
        setHelp(passwordInput, "Password must be at least 8 characters.", "error");
        return false;
      }
      setHelp(passwordInput, "Strong enough to continue.", "success");
      return true;
    }

    function validateSigninForm() {
      return validateEmail() && validatePassword();
    }

    function setLoading(loading, label) {
      isSubmitting = loading;
      submitButton.disabled = loading;
      submitButton.innerHTML = loading
        ? '<span class="spinner" aria-hidden="true"></span>' + label
        : label;
    }

    function normalizeErrorMessage(error) {
      const message = error?.message || "Something went wrong. Please try again.";
      const lower = message.toLowerCase();
      if (lower.includes("invalid login credentials")) {
        return "Incorrect email or password. Please try again.";
      }
      if (lower.includes("email not confirmed")) {
        return "Your email is not confirmed yet. Check your inbox and try again after confirming.";
      }
      if (lower.includes("failed to fetch") || lower.includes("network")) {
        return "Network error. Check your connection and try again.";
      }
      return message;
    }

    async function handleSignin() {
      const { error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: passwordInput.value
      });

      if (error) throw error;

      setStatus("success", "Signed in successfully. Redirecting...");
      redirectToDashboard();
    }

    document.querySelectorAll("[data-toggle-password]").forEach((button) => {
      button.addEventListener("click", () => {
        const target = document.getElementById(button.dataset.togglePassword);
        const hidden = target.type === "password";
        target.type = hidden ? "text" : "password";
        button.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
      });
    });

    emailInput.addEventListener("input", validateEmail);
    passwordInput.addEventListener("input", validatePassword);

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearStatus();

      if (!isConfigured) {
        setStatus("error", "Add your Supabase URL and anon key in the script before using this form.");
        return;
      }

      if (!validateSigninForm() || isSubmitting) {
        if (!isSubmitting) setStatus("error", "Please fix the highlighted fields and try again.");
        return;
      }

      try {
        setLoading(true, "Signing in...");
        await handleSignin();
      } catch (error) {
        setStatus("error", normalizeErrorMessage(error));
      } finally {
        setLoading(false, "Sign In");
      }
    });

    async function boot() {
      if (!isConfigured) {
        setStatus("error", "Supabase is not configured yet. Replace the placeholder URL and anon key to enable auth.");
        return;
      }

      supabaseClient.auth.onAuthStateChange((event, session) => {
        if ((event === "SIGNED_IN" || event === "TOKEN_REFRESHED") && session) {
          redirectToDashboard();
        }
      });

      try {
        const { data: { session }, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (session) redirectToDashboard();
      } catch (error) {
        setStatus("error", normalizeErrorMessage(error));
      }
    }

    boot();
  </script>
</body>
</html>
